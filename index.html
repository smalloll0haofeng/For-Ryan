<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>給辜品睿的網站</title>

<style>
body{
    margin:0;
    height:100vh;
    background:black;
    color:white;
    font-family:sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

h1{
    font-size:42px;
    margin-bottom:60px;
    letter-spacing:3px;
}

.container{
    display:flex;
    gap:40px;
}

.box{
    width:220px;
    height:160px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.3s;
    border:2px solid #555;
}

.box:nth-child(1):hover{
    color:#00ffff;
    border-color:#00ffff;
    box-shadow:0 0 20px #00ffff;
    transform:scale(1.1);
}

.box:nth-child(2):hover{
    color:#00ff88;
    border-color:#00ff88;
    box-shadow:0 0 20px #00ff88;
    transform:scale(1.1);
}

.box:nth-child(3):hover{
    color:#ffcc00;
    border-color:#ffcc00;
    box-shadow:0 0 20px #ffcc00;
    transform:scale(1.1);
}

#popupBg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

#popup{
    width:420px;
    padding:25px;
    border-radius:20px;
    border:2px solid #00ffff;
    box-shadow:0 0 25px #00ffff;
    background:black;
    text-align:center;
}

video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
}
</style>
</head>

<body>

<h1>給「辜品睿」的網站</h1>

<div class="container">
  <div class="box" onclick="play('say.mp4')">與我交流</div>
  <div class="box" onclick="play('teach.mp4')">如何寫網頁</div>
  <div class="box" onclick="goGame()">我的遊戲</div>
</div>

<audio src="bg.mp3" autoplay loop></audio>
<audio id="clickSound" src="click.mp3"></audio>

<div id="popupBg">
    <div id="popup">
        <h2>你還欠獎卡，等還完再說</h2>
        <p id="msg">載入中...</p>
    </div>
</div>

<script>
function play(src){
    document.getElementById("clickSound").play();
    setTimeout(()=>{
        document.body.innerHTML = '<video src="'+src+'" autoplay controls></video>';
    },150);
}

function goGame(){
    document.getElementById("clickSound").play();
    setTimeout(()=>{
        location.href="https://smalloll0haofeng.github.io/HTMLs";
    },150);
}

window.onload = async () => {
    try{
        const card = await (await fetch("text.txt")).text();
        const time = await (await fetch("time.txt")).text();

        document.getElementById("msg").innerText =
            "嗨，辜品睿\n" +
            "我記得你好像還欠我 " + card + " 張獎卡吧\n" +
            "你需要在 " + time + " 前還給我";
    }catch(e){
        document.getElementById("msg").innerText =
            "嗨，辜品睿！\n資料讀取失敗，但你還是欠我獎卡";
    }
};
</script>

</body>
</html>
